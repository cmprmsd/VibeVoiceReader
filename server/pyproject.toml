[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibevoice-reader-server"
version = "0.4.5"
description = "Local TTS server for the VibeVoice Reader Firefox extension"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "websockets",
  "numpy",
  "torch",
  "transformers>=4.51.3,<5.0.0",
  "httpx",
]

[project.scripts]
vibevoice-reader-server = "vibevoice_reader_server.__main__:main"

[tool.setuptools.packages.find]
include = ["vibevoice_reader_server*"]
