# docker compose up -d        (needs the NVIDIA Container Toolkit for GPU access)
# First start downloads the model into the `data` volume.
services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        EXPERIMENTAL_VOICES: "1"   # extra realtime voices (German, French, Japanese, ...); "0" to skip
    image: vibevoice-reader-server:latest
    ports:
      - "127.0.0.1:8877:8877"       # keep it local; the extension talks to localhost
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility   # CUDA only; no graphics/display libraries mounted
      MODELS: realtime              # engines loaded at start: realtime,1.5b,7b
      DEFAULT_MODEL: realtime
      MAX_LOADED: "1"
      QUANT_7B: nf4
      # DEVICE: cpu                 # without a GPU (slow)
    volumes:
      - data:/data                  # Hugging Face cache, previews
      # Your own voice clips (24 kHz mono .wav, named like en-Anna_woman.wav). Added to the
      # built-in ones; drop files in at any time, they show up on the next model (re)load.
      # - ./my-voices:/data/cache/vibevoice-reader/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  data:
