name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx web-ext lint --source-dir dist --warnings-as-errors=false
      - uses: actions/upload-artifact@v4
        with:
          name: extension-unsigned
          path: extension/dist

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q server/vibevoice_reader_server
      - run: python -c "import ast,sys; [ast.parse(open(p).read()) for p in sys.argv[1:]]" server/vibevoice_reader_server/*.py server/vibevoice_reader_server/tools/*.py
