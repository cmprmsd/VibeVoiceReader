# Signs the extension through addons.mozilla.org and attaches the .xpi to a
# GitHub release.  Triggered by pushing a tag like v0.2.2; the tag must match
# the version in extension/static/manifest.json.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AMO_JWT_ISSUER, AMO_JWT_SECRET  — from https://addons.mozilla.org/developers/addon/api/key/
# Secrets are only ever passed to web-ext as environment variables and are
# masked in logs.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Check that the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./static/manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match manifest version $version" >&2
            exit 1
          fi
      - run: npm run build
      - name: Sign with addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx web-ext sign --source-dir dist --channel unlisted --artifacts-dir signed
      - name: Rename artifact
        run: |
          f="$(ls signed/*.xpi | head -1)"
          mv "$f" "signed/vibevoice-reader-${GITHUB_REF_NAME}.xpi"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "signed/vibevoice-reader-${GITHUB_REF_NAME}.xpi" \
            --title "VibeVoice Reader $GITHUB_REF_NAME" \
            --notes "Signed Firefox extension. Install with File → Open in Firefox 140+. See CHANGELOG.md." \
            --repo "$GITHUB_REPOSITORY"
